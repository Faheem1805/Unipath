name: staging checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: synthetic-ci-only-password
          POSTGRES_DB: unipath_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ci -d unipath_test" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://ci:synthetic-ci-only-password@127.0.0.1:5432/unipath_test
      DATABASE_URL: postgresql://ci:synthetic-ci-only-password@127.0.0.1:5432/unipath_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.4' }
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check && pnpm lint && pnpm typecheck
      - run: pnpm build && pnpm test:unit && pnpm test:api
  containers-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.4' }
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile && pnpm db:generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:containers
      - name: Upload redacted acceptance diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-diagnostics
          path: |
            .local/unipath-test-*/diagnostics.log
            .local/unipath-test-*/results.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
